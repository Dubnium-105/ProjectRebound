name: project-rebound-control-plane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-projectrebound}"
      POSTGRES_USER: "${POSTGRES_USER:-projectrebound}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-projectrebound_dev}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectrebound -d projectrebound"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - data

  control-plane:
    build:
      context: ../..
      dockerfile: deployments/compose/control-plane.Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
    environment:
      CONTROL_PLANE_ENVIRONMENT: development
      CONTROL_PLANE_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-projectrebound}:${POSTGRES_PASSWORD:-projectrebound_dev}@postgres:5432/${POSTGRES_DB:-projectrebound}?sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
      AUTH_BIND_REQUESTS_PER_MINUTE: "10"
      AUTH_BIND_PER_IP_PER_MINUTE: "5"
      AUTH_BIND_PER_DEVICE_PER_MINUTE: "3"
      AUTH_BIND_PER_STEAM_ID_PER_MINUTE: "3"
      AUTH_INVITE_REQUIRED: "false"
      RELAY_CONTROL_ADDR: ":9090"
      RELAY_BOOTSTRAP_TOKENS: "${RELAY_BOOTSTRAP_TOKENS:-}"
      RELAY_CA_CERT_PEM_BASE64: "${RELAY_CA_CERT_PEM_BASE64:-}"
      RELAY_CA_KEY_PEM_BASE64: "${RELAY_CA_KEY_PEM_BASE64:-}"
      RELAY_TOKEN_KEY_ID: "${RELAY_TOKEN_KEY_ID:-relay-dev-ephemeral}"
      RELAY_TOKEN_PRIVATE_KEY_BASE64: "${RELAY_TOKEN_PRIVATE_KEY_BASE64:-}"
      ACCESS_TOKEN_KEY_ID: "${ACCESS_TOKEN_KEY_ID:-access-dev-ephemeral}"
      ACCESS_TOKEN_PRIVATE_KEY_BASE64: "${ACCESS_TOKEN_PRIVATE_KEY_BASE64:-}"
      ADMIN_TOKENS: "${ADMIN_TOKENS:-}"
      ADMIN_ACCESS_TOKEN_KEY_ID: "${ADMIN_ACCESS_TOKEN_KEY_ID:-admin-access-dev-ephemeral}"
      ADMIN_ACCESS_TOKEN_PRIVATE_KEY_BASE64: "${ADMIN_ACCESS_TOKEN_PRIVATE_KEY_BASE64:-}"
      ADMIN_MFA_ENCRYPTION_KEY_BASE64: "${ADMIN_MFA_ENCRYPTION_KEY_BASE64:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}"
      TURNSTILE_EXPECTED_HOSTNAME: "${TURNSTILE_EXPECTED_HOSTNAME:-localhost}"
      TURNSTILE_EXPECTED_ACTION: "${TURNSTILE_EXPECTED_ACTION:-admin_login}"
      GAME_SERVER_REGISTRATION_TOKENS: "${GAME_SERVER_REGISTRATION_TOKENS:-}"
      UPDATE_MANIFEST_DIRECTORY: "/deployments/updates"
      UPDATE_SIGNING_KEY_ID: "${UPDATE_SIGNING_KEY_ID:-update-dev-ephemeral}"
      UPDATE_SIGNING_PRIVATE_KEY_BASE64: "${UPDATE_SIGNING_PRIVATE_KEY_BASE64:-}"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/control-plane", "-healthcheck", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "8080"
      - "9090"
    volumes:
      - ../updates:/deployments/updates:ro
    networks:
      - data
      - edge
      - monitoring

  admin-web:
    build:
      context: ../../..
      dockerfile: AdminWeb/Dockerfile
    image: "${ADMIN_WEB_IMAGE:-project-rebound/admin-web:local}"
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0750,uid=10001,gid=10001
      - /data:size=16m,mode=0750,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      control-plane:
        condition: service_healthy
      admin-web:
        condition: service_started
    networks:
      - edge

  blackbox-exporter:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.26.0
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - edge
      - monitoring

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts:/etc/prometheus/alerts:ro
      - ../monitoring/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      control-plane:
        condition: service_healthy
      blackbox-exporter:
        condition: service_started
    networks:
      - monitoring

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  edge-relay:
    profiles: [relay]
    build:
      context: ../..
      dockerfile: deployments/relay/Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
    environment:
      EDGE_RELAY_BOOTSTRAP_TOKEN: "${EDGE_RELAY_BOOTSTRAP_TOKEN:-}"
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "8443:8443/udp"
    volumes:
      - relay-data:/edge-relay-data
    networks:
      - edge

volumes:
  postgres-data:
  redis-data:
  relay-data:
  prometheus-data:
  grafana-data:

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true
