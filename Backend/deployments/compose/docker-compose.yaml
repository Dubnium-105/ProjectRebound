name: project-rebound-control-plane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectrebound
      POSTGRES_USER: projectrebound
      POSTGRES_PASSWORD: projectrebound_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectrebound -d projectrebound"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  control-plane:
    build:
      context: ../..
      dockerfile: deployments/compose/control-plane.Dockerfile
    environment:
      CONTROL_PLANE_ENVIRONMENT: development
      CONTROL_PLANE_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://projectrebound:projectrebound_dev@postgres:5432/projectrebound?sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
      AUTH_BIND_REQUESTS_PER_MINUTE: "10"
      RELAY_CONTROL_ADDR: ":9090"
      RELAY_BOOTSTRAP_TOKENS: "${RELAY_BOOTSTRAP_TOKENS:-}"
      UPDATE_MANIFEST_DIRECTORY: "/deployments/updates"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/control-plane", "-healthcheck", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "8080"
      - "9090"
    volumes:
      - ../updates:/deployments/updates:ro

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      control-plane:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      control-plane:
        condition: service_healthy

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  edge-relay:
    profiles: [relay]
    build:
      context: ../..
      dockerfile: deployments/relay/Dockerfile
    environment:
      EDGE_RELAY_BOOTSTRAP_TOKEN: "${EDGE_RELAY_BOOTSTRAP_TOKEN:-}"
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "8443:8443/udp"
    volumes:
      - relay-data:/edge-relay-data

volumes:
  postgres-data:
  redis-data:
  relay-data:
  prometheus-data:
  grafana-data:
