name: project-rebound-edge-relay

services:
  edge-relay:
    build:
      context: ../..
      dockerfile: deployments/relay/Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
    image: "${EDGE_RELAY_IMAGE:-project-rebound/edge-relay:local}"
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      EDGE_RELAY_BOOTSTRAP_TOKEN: "${EDGE_RELAY_BOOTSTRAP_TOKEN:-}"
    volumes:
      - ./config.edge-relay.yaml:/etc/projectrebound/config.edge-relay.yaml:ro
      - edge-relay-data:/edge-relay-data

volumes:
  edge-relay-data:
