global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: project-rebound-control-plane
    metrics_path: /internal/metrics
    static_configs:
      - targets: [control-plane:8080]

  - job_name: project-rebound-edge-relay
    file_sd_configs:
      - files: [/etc/prometheus/targets/edge-relays.yml]
