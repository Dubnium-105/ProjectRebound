modules:
  meta_http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        min_version: TLS12
  meta_logic_tls:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls: true
      tls_config:
        server_name: logic.dubnium.top
        min_version: TLS12
