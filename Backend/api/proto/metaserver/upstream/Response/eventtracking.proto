// Event tracking / telemetry service
// WARNING: Field numbers are TENTATIVE. Validate with proxy capture.
syntax = "proto3";

package ProjectBoundary;

option go_package = "github.com/projectrebound/matchserver/internal/metaserver/protocol/upstream;upstream";

message Event {
    string name = 1;
    // data field exists but type is TBD (likely bytes or string)
}

message RecordReq {
    string originId = 1;
    repeated Event events = 2;  // field name TBD
}

message RecordResp {
    // no fields found in binary
}
