syntax = "proto3";

package ProjectBoundary;


option go_package = "github.com/projectrebound/matchserver/internal/metaserver/protocol/upstream;upstream";

message PlayerDatapoint{
    string Key = 1;
    sint32 Value = 2;
}

message GetDataStatisticsInfoResponse{
    int32 StatusCode = 1;
    repeated PlayerDatapoint Datapoints = 2;
}