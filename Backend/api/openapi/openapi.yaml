openapi: 3.1.0
info:
  title: Project Rebound Game Control Plane API
  version: 0.1.0
  description: Public control-plane API. Internal Relay APIs are marked with x-internal.
servers:
  - url: https://api.example.com
paths:
  /v1/auth/bind:
    post:
      operationId: bindSteamIdentity
      tags: [Authentication]
      description: Accepts a client-asserted SteamID. This does not prove Steam account ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRequest"
      responses:
        "200":
          description: Player and a new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me:
    get:
      operationId: getCurrentPlayer
      tags: [Players]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current player state, read from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/players:
    get:
      operationId: adminListPlayers
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: account_status
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Paginated players.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/players/{player_id}:
    parameters:
      - $ref: "#/components/parameters/PlayerID"
    get:
      operationId: adminGetPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Player administrative record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminPatchPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlayerPatch"
      responses:
        "200":
          description: Updated player and session revocation count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerPatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/revoke-sessions:
    post:
      operationId: adminRevokePlayerSessions
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      responses:
        "200":
          description: All active sessions for the player were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/game-servers:
    post:
      operationId: registerGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerRegistrationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameServerRegistrationRequest"
      responses:
        "201":
          description: Server registered and management token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerRegistrationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listGameServers
      tags: [Dedicated Servers]
      parameters:
        - in: query
          name: region
          schema: {type: string}
        - in: query
          name: mode
          schema: {type: string}
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/GameServerState"
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Public server directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerListResponse"
  /v1/game-servers/{server_id}:
    parameters:
      - $ref: "#/components/parameters/GameServerID"
    get:
      operationId: getGameServer
      tags: [Dedicated Servers]
      responses:
        "200":
          description: Public server status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deregisterGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerToken: []
      responses:
        "200":
          description: Server deregistered and management token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerDeregistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/game-servers/{server_id}/heartbeat:
    post:
      operationId: heartbeatGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerToken: []
      parameters:
        - $ref: "#/components/parameters/GameServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameServerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerHeartbeatResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Invalid state transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms:
    get:
      operationId: listP2PRooms
      tags: [P2P Rooms]
      parameters:
        - in: query
          name: region
          schema: {type: string}
        - in: query
          name: mode
          schema: {type: string}
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/P2PRoomState"
        - in: query
          name: has_slots
          schema: {type: boolean}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Public P2P room directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomListResponse"
    post:
      operationId: createP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomCreateRequest"
      responses:
        "201":
          description: Room created and its one-time host management credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomCreateResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}:
    parameters:
      - $ref: "#/components/parameters/P2PRoomID"
    get:
      operationId: getP2PRoom
      tags: [P2P Rooms]
      responses:
        "200":
          description: Public room state. Network candidates and credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room closed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/p2p-rooms/{room_id}/join:
    post:
      operationId: joinP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomJoinRequest"
      responses:
        "200":
          description: Membership activated; repeated joins are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room full, not joinable, or client version mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/leave:
    post:
      operationId: leaveP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      responses:
        "200":
          description: Membership deactivated; repeated leaves are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Host must close the room instead of leaving it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/heartbeat:
    post:
      operationId: heartbeatP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Host heartbeat accepted; a stale room returns to LOBBY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomHeartbeatResponse"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/start:
    post:
      operationId: startP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room transitioned from LOBBY to CONNECTING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room cannot start from its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    playerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: Static Admin Token
    gameServerRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: Preconfigured Registration Token
    gameServerToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque Game Server Token
  parameters:
    PlayerID:
      in: path
      name: player_id
      required: true
      schema:
        type: string
    GameServerID:
      in: path
      name: server_id
      required: true
      schema:
        type: string
    P2PRoomID:
      in: path
      name: room_id
      required: true
      schema:
        type: string
    P2PRoomHostToken:
      in: header
      name: X-Room-Host-Token
      required: true
      description: Independent high-entropy room host credential. It is returned only at room creation.
      schema:
        type: string
        minLength: 64
  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, reused, or revoked session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-IP request limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminUnauthorized:
      description: A dedicated administrator token is required; Player tokens are not accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not exposed on this network.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BindRequest:
      type: object
      additionalProperties: false
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
          pattern: "^[0-9]{16,20}$"
        persona_name:
          type: string
          maxLength: 64
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 64
    SessionTokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
    PlayerProfile:
      type: object
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
        persona_name:
          type: string
    BindData:
      type: object
      required: [player_id, account_status, is_vip, profile, session, is_new_player]
      properties:
        player_id:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        profile:
          $ref: "#/components/schemas/PlayerProfile"
        session:
          $ref: "#/components/schemas/SessionTokens"
        is_new_player:
          type: boolean
    BindResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/BindData"
        request_id:
          type: string
    RefreshData:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/SessionTokens"
    RefreshResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RefreshData"
        request_id:
          type: string
    LogoutResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out:
              type: boolean
        request_id:
          type: string
    AccountStatus:
      type: string
      enum: [ACTIVE, BANNED, DELETED]
    MeData:
      type: object
      required: [player_id, steam_id, persona_name, account_status, is_vip, last_login_at, created_at]
      properties:
        player_id:
          type: string
        steam_id:
          type: string
        persona_name:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MeResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/MeData"
        request_id:
          type: string
    AdminPlayer:
      allOf:
        - $ref: "#/components/schemas/MeData"
        - type: object
          required: [auth_provider, auth_level, updated_at]
          properties:
            auth_provider:
              type: string
              enum: [steam_client_asserted, steam_ticket, steam_openid]
            auth_level:
              type: string
              enum: [unverified, verified]
            updated_at:
              type: string
              format: date-time
    AdminPlayerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        revoke_sessions:
          type: boolean
          default: false
    AdminPlayerResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminPlayer"
        request_id:
          type: string
    AdminPlayerListData:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPlayer"
        next_cursor:
          type: string
    AdminPlayerListResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminPlayerListData"
        request_id:
          type: string
    AdminPlayerPatchData:
      type: object
      required: [player, revoked_sessions]
      properties:
        player:
          $ref: "#/components/schemas/AdminPlayer"
        revoked_sessions:
          type: integer
          minimum: 0
    AdminPlayerPatchResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AdminPlayerPatchData"
        request_id:
          type: string
    AdminSessionRevocationResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [revoked_sessions]
          properties:
            revoked_sessions:
              type: integer
              minimum: 0
        request_id:
          type: string
    GameServerState:
      type: string
      enum: [STARTING, READY, RESERVED, RUNNING, DRAINING, UNHEALTHY, OFFLINE]
    GameServerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [instance_id, display_name, region, mode, version, public_host, public_port, max_players]
      properties:
        instance_id: {type: string, maxLength: 128}
        display_name: {type: string, maxLength: 128}
        region: {type: string, maxLength: 64}
        mode: {type: string, maxLength: 64}
        version: {type: string, maxLength: 64}
        public_host:
          type: string
          description: Public unicast IP address; private and loopback addresses are rejected.
        public_port: {type: integer, minimum: 1, maximum: 65535}
        max_players: {type: integer, minimum: 1, maximum: 256}
    GameServerRegistrationData:
      type: object
      required: [server_id, server_token, heartbeat_interval_seconds, token_expires_at]
      properties:
        server_id: {type: string}
        server_token: {type: string}
        heartbeat_interval_seconds: {type: integer, minimum: 1}
        token_expires_at: {type: string, format: date-time}
    GameServerRegistrationResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/GameServerRegistrationData"
        request_id: {type: string}
    GameServerHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [state, player_count]
      properties:
        state:
          type: string
          enum: [STARTING, READY, RESERVED, RUNNING, DRAINING]
        player_count: {type: integer, minimum: 0}
    GameServerEndpoint:
      type: object
      required: [host, port]
      properties:
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
    PublicGameServer:
      type: object
      description: Whitelisted public fields; management credentials and private endpoints are never included.
      required: [server_id, display_name, region, mode, version, endpoint, max_players, player_count, state, last_heartbeat_at]
      properties:
        server_id: {type: string}
        display_name: {type: string}
        region: {type: string}
        mode: {type: string}
        version: {type: string}
        endpoint:
          $ref: "#/components/schemas/GameServerEndpoint"
        max_players: {type: integer}
        player_count: {type: integer}
        state:
          $ref: "#/components/schemas/GameServerState"
        last_heartbeat_at: {type: string, format: date-time}
    GameServerResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/PublicGameServer"
        request_id: {type: string}
    GameServerListData:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicGameServer"
        next_cursor: {type: string}
    GameServerListResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/GameServerListData"
        request_id: {type: string}
    GameServerHeartbeatData:
      type: object
      required: [server, next_heartbeat_seconds]
      properties:
        server:
          $ref: "#/components/schemas/PublicGameServer"
        next_heartbeat_seconds: {type: integer, minimum: 1}
    GameServerHeartbeatResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/GameServerHeartbeatData"
        request_id: {type: string}
    GameServerDeregistrationResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [deregistered]
          properties:
            deregistered: {type: boolean}
        request_id: {type: string}
    P2PRoomState:
      type: string
      enum: [LOBBY, CONNECTING, RUNNING, STALE, CLOSED]
    P2PRoomCreateRequest:
      type: object
      additionalProperties: false
      required: [display_name, region, mode, version, max_players]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 128}
        region: {type: string, minLength: 1, maxLength: 64}
        mode: {type: string, minLength: 1, maxLength: 64}
        version: {type: string, minLength: 1, maxLength: 64}
        max_players: {type: integer, minimum: 2, maximum: 64}
    P2PRoomJoinRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: string, minLength: 1, maxLength: 64}
    PublicP2PRoom:
      type: object
      description: Whitelisted room metadata. Host credentials, IP addresses, NAT details, candidates, and relay data are excluded.
      required: [room_id, host_player_id, display_name, region, mode, version, max_players, player_count, state, last_heartbeat_at, created_at]
      properties:
        room_id: {type: string}
        host_player_id: {type: string}
        display_name: {type: string}
        region: {type: string}
        mode: {type: string}
        version: {type: string}
        max_players: {type: integer, minimum: 2, maximum: 64}
        player_count: {type: integer, minimum: 0, maximum: 64}
        state:
          $ref: "#/components/schemas/P2PRoomState"
        last_heartbeat_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    P2PRoomResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/PublicP2PRoom"
        request_id: {type: string}
    P2PRoomCreateData:
      type: object
      required: [room, host_token, heartbeat_interval_seconds]
      properties:
        room:
          $ref: "#/components/schemas/PublicP2PRoom"
        host_token:
          type: string
          minLength: 64
          description: One-time room host credential. The service persists only its SHA-256 hash.
        heartbeat_interval_seconds: {type: integer, minimum: 1}
    P2PRoomCreateResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/P2PRoomCreateData"
        request_id: {type: string}
    P2PRoomListData:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicP2PRoom"
        next_cursor: {type: string}
    P2PRoomListResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/P2PRoomListData"
        request_id: {type: string}
    P2PRoomHeartbeatData:
      type: object
      required: [room, next_heartbeat_seconds]
      properties:
        room:
          $ref: "#/components/schemas/PublicP2PRoom"
        next_heartbeat_seconds: {type: integer, minimum: 1}
    P2PRoomHeartbeatResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/P2PRoomHeartbeatData"
        request_id: {type: string}
    HealthSuccess:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [live, ready]
        request_id:
          type: string
          pattern: "^req_[A-Za-z0-9_-]+$"
    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
