              type: object
              additionalProperties: false
              required: [node_id, protocol, host, port]
              properties:
                node_id: {type: string}
                protocol: {type: string, enum: [udp, tcp_tls]}
                host: {type: string}
                port: {type: integer, minimum: 1, maximum: 65535}
            relay_token:
              type: string
              description: Participant-specific signed token; HOST and PEER receive distinct values.
            expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
