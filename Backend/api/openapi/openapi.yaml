                $ref: "#/components/schemas/GameServerDeregistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/game-servers/{server_id}/heartbeat:
    post:
      operationId: heartbeatGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerToken: []
      parameters:
        - $ref: "#/components/parameters/GameServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameServerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerHeartbeatResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Invalid state transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms:
    get:
      operationId: listP2PRooms
      tags: [P2P Rooms]
      parameters:
        - in: query
          name: region
          schema: {type: string}
        - in: query
          name: mode
          schema: {type: string}
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/P2PRoomState"
        - in: query
          name: has_slots
          schema: {type: boolean}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Public P2P room directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomListResponse"
    post:
      operationId: createP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomCreateRequest"
      responses:
        "201":
          description: Room created and its one-time host management credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomCreateResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}:
    parameters:
      - $ref: "#/components/parameters/P2PRoomID"
    get:
      operationId: getP2PRoom
      tags: [P2P Rooms]
      responses:
        "200":
          description: Public room state. Network candidates and credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room closed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/p2p-rooms/{room_id}/join:
    post:
      operationId: joinP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomJoinRequest"
      responses:
        "200":
          description: Membership activated; repeated joins are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room full, not joinable, or client version mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/leave:
    post:
      operationId: leaveP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      responses:
        "200":
          description: Membership deactivated; repeated leaves are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Host must close the room instead of leaving it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/heartbeat:
    post:
      operationId: heartbeatP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Host heartbeat accepted; a stale room returns to LOBBY and all non-terminal room connection leases are renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomHeartbeatResponse"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/start:
    post:
      operationId: startP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room transitioned from LOBBY to CONNECTING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room cannot start from its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/matches/active:
    get:
      operationId: getActiveP2PMatch
      tags: [P2P BattleLog]
      description: Returns the server-created match identity for a member of the frozen room roster.
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      responses:
        "200":
          description: Active P2P match collection state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/P2PActiveMatchResponse"}
        "403":
          description: Verified frozen-roster membership is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/p2p-matches/{match_id}/report-capability:
    post:
      operationId: issueP2PReportCapability
      tags: [P2P BattleLog]
      description: Rotates and returns a session-family-bound report capability for an eligible frozen-roster member.
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PMatchID"
      responses:
        "201":
          description: Capability issued. The report token is shown only here and must not be passed to the injected payload.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/P2PReportCapabilityResponse"}
        "403":
          description: Verified eligible reporter membership is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Match is no longer accepting reports.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/p2p-matches/{match_id}/presence/me:
    put:
      operationId: updateOwnP2PMatchPresence
      tags: [P2P BattleLog]
      description: Records monotonic launcher presence, disconnect, reconnect, result-screen, and exit-intent checkpoints.
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PMatchID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/P2PPresenceRequest"}
      responses:
        "200":
          description: Presence checkpoint accepted or identified as an idempotent duplicate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/P2PPresenceResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "403":
          description: Verified frozen-roster membership is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: The match is finalized.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/p2p-matches/{match_id}/reports/{report_id}:
    put:
      operationId: submitP2PBattleLogV3
      tags: [P2P BattleLog]
      description: >-
        Uploads one bounded raw v3 snapshot. Authentication requires both the
        verified player access token and its session-bound report capability.
        Idempotency is scoped to match, reporter, and report_id; a FINAL report
        is immutable per reporter.
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PMatchID"
        - $ref: "#/components/parameters/P2PReportID"
        - $ref: "#/components/parameters/P2PReportToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/P2PBattleLogRawV3"}
      responses:
        "200":
          description: Report stored, quarantined for review, or returned as an idempotent duplicate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/P2PBattleLogSubmissionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Verified reporter identity or report context rejected.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Conflicting report ID/final report, or finalized match.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "413":
          description: Snapshot exceeds the configured P2P report limit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "415":
          description: Content-Type is not application/json.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "422":
          description: Snapshot, roster identity, or timeline chain is invalid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/p2p-matches/{match_id}/result:
    get:
      operationId: getP2PBattleLogResult
      tags: [P2P BattleLog]
      description: Returns collection progress or the immutable deadline/quorum decision to a frozen-roster member.
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PMatchID"
      responses:
        "200":
          description: Current collection or finalized P2P result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/P2PBattleLogResultResponse"}
        "403":
          description: Verified frozen-roster membership is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/connections:
    post:
      operationId: createConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Idempotently creates a host-to-peer session. Joining a P2P room also creates this session automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreateRequest"
      responses:
        "201":
          description: Connection created or its active idempotent result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account or active room membership rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      operationId: getConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Returns candidates only to the connection's host or peer.
      responses:
        "200":
          description: Participant-scoped connection state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: Caller is not a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Connection closed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: Active account and connection participation are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/realtime/connect:
    get:
      operationId: connectRealtime
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Upgrades to an authenticated WebSocket. Access tokens are accepted only in the Authorization header, never in the URL.
      x-websocket:
        inbound-message:
          oneOf:
            - $ref: "#/components/schemas/ConnectionCandidateEvent"
            - $ref: "#/components/schemas/ConnectionCheckResultEvent"
        outbound-message:
          oneOf:
            - $ref: "#/components/schemas/ConnectionRealtimeEvent"
            - $ref: "#/components/schemas/ConnectionRelayAllocatedEvent"
            - $ref: "#/components/schemas/ConnectionRelayMigratingEvent"
            - $ref: "#/components/schemas/ConnectionRelayMigratedEvent"
            - $ref: "#/components/schemas/ConnectionRelayFailedEvent"
            - $ref: "#/components/schemas/RealtimeErrorEvent"
      responses:
        "101":
          description: WebSocket protocol switched.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/enroll:
    post:
      operationId: enrollRelayNode
      tags: [Internal Relay]
      x-internal: true
      description: Consumes a one-time bootstrap token and returns a node credential, mTLS certificate, CA, and relay-token verification keyset.
      security:
        - relayBootstrapToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayEnrollRequest"
      responses:
        "201":
          description: Relay node enrolled; node_token is returned once and persisted only as a hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayEnrollResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/{node_id}/certificate/renew:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: renewRelayNodeCertificate
      tags: [Internal Relay]
      x-internal: true
      security:
        - relayNodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayCertificateRenewRequest"
      responses:
        "200":
          description: A newly signed client certificate and current verification keyset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayCertificateRenewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    get:
      operationId: getRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Relay node operational state. Node credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/v1/relay-nodes:
    get:
      operationId: listRelayNodes
      tags: [Internal Relay]
      x-internal: true
      description: Lists every registered relay node, including offline and revoked nodes, using stable node-ID cursor pagination.
      security:
        - adminToken: []
      parameters:
        - {in: query, name: region, schema: {type: string}}
        - {in: query, name: zone, schema: {type: string}}
        - {in: query, name: provider, schema: {type: string}}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/RelayNodeState"
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Relay node page. Credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/{node_id}/drain:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: drainRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                deadline_seconds: {type: integer, minimum: 30, maximum: 86400, default: 300}
                migrate_existing: {type: boolean, default: false}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: Node stopped receiving new allocations; existing allocations remain until expiry or drain deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
        "409":
          description: Node is not READY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/relay-nodes/{node_id}/resume:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: resumeRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminOperationReason"}
      responses:
        "200":
          description: Node returned to READY and may receive new allocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
  /internal/v1/relay-nodes/{node_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: revokeRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminOperationReason"}
      responses:
        "200":
          description: Node certificate identity and node credential permanently rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
  /internal/v1/relay-signing-keys/{key_id}/activate:
    parameters:
      - in: path
        name: key_id
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    post:
      operationId: activateRelaySigningKey
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminOperationReason"}
      responses:
        "200":
          description: Signing key activated after every READY Relay acknowledged the staged keyset.
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data: {$ref: "#/components/schemas/RelayTokenKeyset"}
                  request_id: {type: string}
        "409":
          description: One or more READY Relay nodes have not acknowledged the staged keyset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/updates/check:
    get:
      operationId: checkForClientUpdate
      tags: [Updates]
      description: Public metadata endpoint; banned players may also use it because it requires no player token.
      parameters:
        - in: query
          name: platform
          required: true
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
        - in: query
          name: architecture
          schema: {type: string, default: amd64}
        - in: query
          name: channel
          schema: {type: string, enum: [stable, beta, toolbox], default: stable}
        - in: query
          name: current_version
          required: true
          schema: {type: string, example: 1.0.0}
      responses:
        "200":
          description: Latest compatible release and whether the update is mandatory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/updates/{platform}/{version}/manifest:
    get:
      operationId: getSignedUpdateManifest
      tags: [Updates]
      parameters:
        - in: path
          name: platform
          required: true
          schema: {type: string}
        - in: path
          name: version
          required: true
          schema: {type: string}
        - in: query
          name: architecture
          schema: {type: string, default: amd64}
        - in: query
          name: channel
          schema: {type: string, enum: [stable, beta, toolbox], default: stable}
      responses:
        "200":
          description: Deterministically serialized and Ed25519-signed release manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/updates/files/{file_id}:
    get:
      operationId: getUpdateFileDownload
      tags: [Updates]
      description: Returns CDN/object-storage metadata only; the API never proxies the large file body.
      parameters:
        - in: path
          name: file_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Immutable CDN download metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateFileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/client/config:
    get:
      operationId: getClientConfiguration
      tags: [Configuration]
      description: Returns protocol features and currently available relay regions, never individual relay endpoints.
      responses:
        "200":
          description: Public client bootstrap configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfigResponse"
  /:
    get:
      operationId: getMetaServerBootstrap
      tags: [MetaServer]
      description: Public MetaServer compatibility bootstrap. It contains only fresh, discoverable Relay endpoints.
      responses:
        "200":
          description: MetaServer bootstrap data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaBootstrapResponse"}
  /connectServer:
    post:
      operationId: connectMetaServerCompatibility
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      description: Compatibility endpoint used only through MetaTunnel. Any playerId or loginToken field is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaSessionRequest"}
      responses:
        "200":
          description: Compatibility Gate response. MetaTunnel rewrites endpoint to its loopback listener.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaConnectServerResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meta/regions:
    get:
      operationId: listMetaRegions
      tags: [MetaServer]
      description: Lists regions backed by READY Relay nodes with fresh heartbeats.
      responses:
        "200":
          description: Dynamic QoS region list.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaRegionListResponse"}
  /v1/meta/playlists:
    get:
      operationId: listMetaPlaylists
      tags: [MetaServer]
      responses:
        "200":
          description: Enabled playlists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPlaylistListResponse"}
  /v1/meta/notifications:
    get:
      operationId: listMetaNotifications
      tags: [MetaServer]
      parameters:
        - in: query
          name: locale
          schema: {type: string, maxLength: 16}
      responses:
        "200":
          description: Active notifications in the requested locale.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaNotificationListResponse"}
  /v1/meta/sessions:
    post:
      operationId: createMetaSession
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaSessionRequest"}
      responses:
        "201":
          description: A single-use, short-lived Gate ticket.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaSessionResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/users/me/meta-profile:
    get:
      operationId: getMyMetaProfile
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Authenticated player's Meta profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaProfileResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/users/me/loadouts:
    get:
      operationId: listMyMetaLoadouts
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Authenticated player's role loadouts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaLoadoutListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/users/me/loadouts/{role_id}:
    parameters:
      - {$ref: "#/components/parameters/MetaRoleID"}
    get:
      operationId: getMyMetaLoadout
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Role loadout and current revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaLoadoutResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateMyMetaLoadout
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaLoadoutUpdateRequest"}
      responses:
        "200":
          description: Updated role loadout with incremented revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaLoadoutResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/meta/parties:
    post:
      operationId: createMetaParty
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaPartyCreateRequest"}
      responses:
        "201":
          description: Created party.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPartyResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/meta/parties/{party_id}:
    parameters:
      - {$ref: "#/components/parameters/MetaPartyID"}
    get:
      operationId: getMetaParty
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      description: Returns the party only when the authenticated player is a member.
      responses:
        "200":
          description: Party state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPartyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/meta/parties/{party_id}/ready:
    parameters:
      - {$ref: "#/components/parameters/MetaPartyID"}
    post:
      operationId: setMetaPartyReady
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaPartyReadyRequest"}
      responses:
        "200":
          description: Updated party.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPartyResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/meta/parties/{party_id}/presence:
    parameters:
      - {$ref: "#/components/parameters/MetaPartyID"}
    post:
      operationId: setMetaPartyPresence
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaPartyPresenceRequest"}
      responses:
        "200":
          description: Updated party.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPartyResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/meta/matchmaking/tickets:
    post:
      operationId: createMetaMatchTicket
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaMatchTicketCreateRequest"}
      responses:
        "202":
          description: Queued match ticket. No P2P fallback is implied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaMatchTicketResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/meta/matchmaking/tickets/{ticket_id}:
    parameters:
      - {$ref: "#/components/parameters/MetaTicketID"}
    get:
      operationId: getMetaMatchTicket
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      description: Ticket ownership is derived from the access token; cross-player access is hidden as not found.
      responses:
        "200":
          description: Current ticket state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaMatchTicketResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: cancelMetaMatchTicket
      tags: [MetaServer]
      security:
        - playerAccessToken: []
      responses:
        "204": {description: Ticket cancelled.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /internal/v1/meta/matches/{match_id}/players/{player_id}/loadout:
    get:
      operationId: getAssignedMetaPlayerLoadout
      tags: [MetaServer Internal]
      x-internal: true
      security:
        - gameServerToken: []
      parameters:
        - {$ref: "#/components/parameters/MetaMatchID"}
        - {$ref: "#/components/parameters/PlayerID"}
        - {$ref: "#/components/parameters/GameServerIdentity"}
      description: Requires meta.loadouts.read scope and an active match assigned to this Game Server.
      responses:
        "200":
          description: Match-bound loadout snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaMatchPlayerLoadoutResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /internal/v1/meta/matches/{match_id}/players/{player_id}/connected:
    post:
      operationId: markAssignedMetaPlayerConnected
      tags: [MetaServer Internal]
      x-internal: true
      description: Requires meta.matches.connect scope and the assigned active match/player.
      security:
        - gameServerToken: []
      parameters:
        - {$ref: "#/components/parameters/MetaMatchID"}
        - {$ref: "#/components/parameters/PlayerID"}
        - {$ref: "#/components/parameters/GameServerIdentity"}
      responses:
        "204": {description: Player connection recorded.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /internal/v1/meta/matches/{match_id}/completed:
    post:
      operationId: completeAssignedMetaMatch
      tags: [MetaServer Internal]
      x-internal: true
      description: Requires meta.matches.complete scope and an active match assigned to this Game Server.
      security:
        - gameServerToken: []
      parameters:
        - {$ref: "#/components/parameters/MetaMatchID"}
        - {$ref: "#/components/parameters/GameServerIdentity"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MetaMatchCompleteRequest"}
      responses:
        "204": {description: Match completed and Game Server returned to READY.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /internal/v1/meta/battlelog/reports/{report_id}:
    put:
      operationId: submitBattleLogReport
      tags: [MetaServer Internal]
      x-internal: true
      description: |
        Requires meta.battlelog.write scope. The report is idempotent per
        Game Server and report_id. A matching active assignment is authoritative;
        otherwise the report is retained as a non-official standalone record.
      security:
        - gameServerToken: []
      parameters:
        - {$ref: "#/components/parameters/BattleLogReportID"}
        - {$ref: "#/components/parameters/GameServerIdentity"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BattleLogSubmitRequest"}
      responses:
        "200":
          description: Idempotent replay of an existing report with the same SHA-256.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BattleLogSubmitResponse"}
        "201":
          description: BattleLog report stored and normalized.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BattleLogSubmitResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Scope, Game Server, or assigned-match check failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: Snapshot schema or required server-side evidence is invalid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/admin/meta/overview:
    get:
      operationId: adminGetMetaOverview
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: MetaServer operational counters.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMetaOverviewResponse"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
  /v1/admin/meta/players/{player_id}/loadouts:
    get:
      operationId: adminListMetaPlayerLoadouts
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
      parameters:
        - {$ref: "#/components/parameters/PlayerID"}
      responses:
        "200":
          description: Player loadouts for authorized support review.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaLoadoutListResponse"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
  /v1/admin/meta/players/{player_id}/loadouts/{role_id}:
    put:
      operationId: adminUpdateMetaPlayerLoadout
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
          adminStepUpToken: []
      parameters:
        - {$ref: "#/components/parameters/PlayerID"}
        - {$ref: "#/components/parameters/MetaRoleID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminMetaLoadoutUpdateRequest"}
      responses:
        "200":
          description: Updated and audited loadout.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaLoadoutResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/admin/meta/matches:
    get:
      operationId: adminListMetaMatches
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Most recently updated matches.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminMetaMatchListResponse"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
  /v1/admin/meta/matches/{match_id}/cancel:
    post:
      operationId: adminCancelMetaMatch
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
          adminStepUpToken: []
      parameters:
        - {$ref: "#/components/parameters/MetaMatchID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReasonRequest"}
      responses:
        "204": {description: "Match cancelled, reservation released, and action audited."}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/admin/meta/playlists/{slug}:
    put:
      operationId: adminUpsertMetaPlaylist
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
          adminStepUpToken: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminMetaPlaylistUpsertRequest"}
      responses:
        "200":
          description: Playlist upserted and audited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaPlaylistResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
  /v1/admin/meta/notifications/{notification_id}:
    put:
      operationId: adminUpsertMetaNotification
      tags: [Admin MetaServer]
      security:
        - adminAccessToken: []
          adminStepUpToken: []
      parameters:
        - in: path
          name: notification_id
          required: true
          schema: {type: string, maxLength: 64}
          description: Use new to allocate a new notification ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminMetaNotificationUpsertRequest"}
      responses:
        "200":
          description: Notification upserted and audited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MetaNotificationResponse"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
  /internal/metrics:
    get:
      operationId: getControlPlaneMetrics
      tags: [Internal Monitoring]
      x-internal: true
      description: Prometheus text exposition restricted to trusted private source networks and blocked by the public proxy.
      responses:
        "200":
          description: Control-plane process, HTTP, business, database-pool, and state metrics.
          content:
            text/plain:
              schema: {type: string}
        "403":
          description: Source address is outside the trusted private monitoring networks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    playerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: Static Admin Token
      description: Machine-only token for internal operational routes. It is not accepted by the Admin Web API.
    adminAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA Administrator JWT
      description: Short-lived human administrator token issued only after Turnstile, password, and MFA validation.
    adminStepUpToken:
      type: apiKey
      in: header
      name: X-Admin-Step-Up
      description: Short-lived MFA proof bound to the current administrator and session.
    gameServerRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: Preconfigured Registration Token
    gameServerToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque Game Server Token
    relayBootstrapToken:
      type: http
      scheme: bearer
      bearerFormat: One-Time Relay Bootstrap Token
    relayNodeToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque Relay Node Token
  parameters:
    PlayerID:
      in: path
      name: player_id
      required: true
      schema:
        type: string
    GameServerID:
      in: path
      name: server_id
      required: true
      schema:
        type: string
    P2PRoomID:
      in: path
      name: room_id
      required: true
      schema:
        type: string
    P2PRoomHostToken:
      in: header
      name: X-Room-Host-Token
      required: true
      description: Independent high-entropy room host credential. It is returned only at room creation.
      schema:
        type: string
        minLength: 64
    P2PMatchID:
      in: path
      name: match_id
      required: true
      schema:
        type: string
        pattern: "^p2pm_[A-Za-z0-9_-]+$"
    P2PReportID:
      in: path
      name: report_id
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    P2PReportToken:
      in: header
      name: X-P2P-Report-Token
      required: true
      description: Session-family-bound opaque capability retained and attached by Launcher; never exposed to the game DLL.
      schema:
        type: string
        minLength: 40
    P2PEvidenceID:
      in: path
      name: evidence_id
      required: true
      schema:
        type: string
        pattern: "^p2pr_[A-Za-z0-9_-]+$"
    ConnectionID:
      in: path
      name: connection_id
      required: true
      schema:
        type: string
    RelayNodeID:
      in: path
      name: node_id
      required: true
      schema:
        type: string
        pattern: "^relay_[A-Za-z0-9]+$"
    RoomID:
      in: path
      name: room_id
      required: true
      schema:
        type: string
        pattern: "^room_[A-Za-z0-9]+$"
    MetaRoleID:
      in: path
      name: role_id
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{1,128}$"
    MetaPartyID:
      in: path
      name: party_id
      required: true
      schema:
        type: string
        pattern: "^mp_[A-Za-z0-9_-]+$"
    MetaTicketID:
      in: path
      name: ticket_id
      required: true
      schema:
        type: string
        pattern: "^mt_[A-Za-z0-9_-]+$"
    MetaMatchID:
      in: path
      name: match_id
      required: true
      schema:
        type: string
        pattern: "^mm_[A-Za-z0-9_-]+$"
    BattleLogReportID:
      in: path
      name: report_id
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    GameServerIdentity:
      in: header
      name: X-Game-Server-Id
      required: true
      schema:
        type: string
      description: Must identify the same Game Server encoded in the scoped bearer token.
  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, reused, or revoked session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: An authentication rate limit was exceeded. Retry-After is returned when applicable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminUnauthorized:
      description: Administrator authentication failed or the short-lived administrator session is unavailable. Player tokens are never accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not exposed on this network.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested operation conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required coordinator or healthy target is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BindRequest:
      type: object
      additionalProperties: false
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
          pattern: "^[0-9]{16,20}$"
        persona_name:
          type: string
          maxLength: 64
        device_id:
          type: string
          maxLength: 128
          pattern: "^[ -~]+$"
          example: "hardware-uuid|disk-serial|cpu-id"
          description: >-
            Optional untrusted risk signal. New clients may send uuid|disk|cpu;
            each factor is independently HMAC-hashed. The existing versioned
            v1|uu:<16 hex>|ds:<16 hex>|cp:<16 hex> representation remains
            accepted, as do legacy opaque printable-ASCII values without pipes.
        invite_code:
          type: string
          maxLength: 128
          description: Optional unless the server has auth.invite_required enabled.
        encrypted_ticket:
          type: string
          maxLength: 4096
          pattern: "^[0-9A-Fa-f]+$"
          description: >-
            Optional Steam Encrypted App Ticket encoded as hexadecimal. The
            plaintext ticket is never persisted. Supplying an invalid ticket
            fails the request rather than falling back to unverified.
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 64
    SessionTokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
    PlayerProfile:
      type: object
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
        persona_name:
          type: string
    BindData:
      type: object
      required: [player_id, account_status, is_vip, profile, session, is_new_player, auth_level, steam_verified, integrity_challenge]
      properties:
        player_id:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        profile:
          $ref: "#/components/schemas/PlayerProfile"
        session:
          $ref: "#/components/schemas/SessionTokens"
        is_new_player:
          type: boolean
        auth_level:
          type: string
          enum: [unverified, verified, trusted]
        steam_verified:
          type: boolean
        integrity_challenge:
          $ref: "#/components/schemas/IntegrityChallengeData"
    BindResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/BindData"
        request_id:
          type: string
    IntegrityChallengeData:
      type: object
