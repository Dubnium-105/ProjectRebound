    ConnectionState:
      type: string
      enum: [CREATED, GATHERING_CANDIDATES, CHECKING_DIRECT, ALLOCATING_RELAY, RELAY_BINDING, CONNECTED, FAILED, EXPIRED, CLOSED]
    ConnectionPath:
      type: string
      enum: [LAN, IPV6, UDP_PUNCH, UDP_RELAY, TCP_TLS_RELAY]
    ConnectionCreateRequest:
      type: object
      additionalProperties: false
      required: [room_id]
      properties:
        room_id: {type: string}
        peer_player_id:
          type: string
          description: Required only when the room host creates a connection for a peer.
    ConnectionCandidate:
      type: object
      additionalProperties: false
      required: [candidate_id, connection_id, player_id, foundation, candidate_type, protocol, address, port, priority, created_at]
      properties:
        candidate_id: {type: string}
        connection_id: {type: string}
        player_id: {type: string}
        foundation: {type: string, minLength: 1, maxLength: 64}
        candidate_type: {type: string, enum: [LAN, IPV6, SRFLX]}
        protocol: {type: string, enum: [UDP, TCP]}
        address:
          type: string
          description: Participant-only IP candidate; never exposed by the public room directory.
        port: {type: integer, minimum: 1, maximum: 65535}
        priority: {type: integer, minimum: 1, maximum: 2147483647}
        created_at: {type: string, format: date-time}
    ConnectionCandidateInput:
      type: object
      additionalProperties: false
      required: [connection_id, foundation, candidate_type, protocol, address, port, priority]
      properties:
        connection_id: {type: string}
        foundation: {type: string, minLength: 1, maxLength: 64}
        candidate_type: {type: string, enum: [LAN, IPV6, SRFLX]}
        protocol: {type: string, enum: [UDP, TCP]}
        address: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        priority: {type: integer, minimum: 1, maximum: 2147483647}
    ConnectionData:
      type: object
      required: [connection_id, room_id, host_player_id, peer_player_id, state, expires_at, created_at, updated_at, candidates]
      properties:
        connection_id: {type: string}
        room_id: {type: string}
        host_player_id: {type: string}
        peer_player_id: {type: string}
        state:
          $ref: "#/components/schemas/ConnectionState"
        selected_path:
          $ref: "#/components/schemas/ConnectionPath"
        failure_reason: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionCandidate"
    ConnectionResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/ConnectionData"
        request_id: {type: string}
    ConnectionEventType:
      type: string
      enum:
        - connection.created
        - connection.candidate
        - connection.check_result
        - connection.path_selected
        - connection.path_failed
        - connection.relay_allocated
        - connection.relay_migrating
        - connection.relay_migrated
        - connection.relay_failed
        - connection.closed
    ConnectionCandidateEvent:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type: {type: string, const: connection.candidate}
        payload:
          $ref: "#/components/schemas/ConnectionCandidateInput"
    ConnectionCheckResultPayload:
      type: object
      additionalProperties: false
      required: [connection_id, success, path, latency_ms]
      properties:
        connection_id: {type: string}
        success: {type: boolean}
        path:
          type: string
          enum: [LAN, IPV6, UDP_PUNCH]
        latency_ms: {type: integer, minimum: 0, maximum: 60000}
        reason: {type: string, maxLength: 128}
    ConnectionCheckResultEvent:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type: {type: string, const: connection.check_result}
        payload:
          $ref: "#/components/schemas/ConnectionCheckResultPayload"
    ConnectionRealtimeEvent:
      type: object
      required: [type, payload, created_at]
      properties:
        type:
          $ref: "#/components/schemas/ConnectionEventType"
        payload:
          type: object
          additionalProperties: true
        created_at: {type: string, format: date-time}
    RealtimeErrorEvent:
      type: object
      required: [type, payload, created_at]
      properties:
        type: {type: string, const: error}
        payload:
          $ref: "#/components/schemas/Error"
        created_at: {type: string, format: date-time}
    RelayNodeState:
      type: string
      enum: [BOOTSTRAPPING, CONNECTING, READY, DRAINING, UNHEALTHY, OFFLINE, REVOKED]
    RelayEndpoint:
      type: object
      additionalProperties: false
      required: [protocol, host, port]
      properties:
        protocol: {type: string, enum: [UDP, TCP_TLS]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
    RelayCapacity:
      type: object
      additionalProperties: false
      required: [max_allocations, max_egress_bps]
