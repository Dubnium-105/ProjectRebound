openapi: 3.1.0
info:
  title: Project Rebound Game Control Plane API
  version: 0.1.0
  description: Public control-plane API. Internal Relay APIs are marked with x-internal.
servers:
  - url: https://api.example.com
paths:
  /v1/auth/bind:
    post:
      operationId: bindSteamIdentity
      tags: [Authentication]
      description: Accepts a client-asserted SteamID. This does not prove Steam account ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRequest"
      responses:
        "200":
          description: Player and a new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me:
    get:
      operationId: getCurrentPlayer
      tags: [Players]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current player state, read from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    playerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, reused, or revoked session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-IP request limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BindRequest:
      type: object
      additionalProperties: false
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
          pattern: "^[0-9]{16,20}$"
        persona_name:
          type: string
          maxLength: 64
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 64
    SessionTokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
    PlayerProfile:
      type: object
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
        persona_name:
          type: string
    BindData:
      type: object
      required: [player_id, account_status, is_vip, profile, session, is_new_player]
      properties:
        player_id:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        profile:
          $ref: "#/components/schemas/PlayerProfile"
        session:
          $ref: "#/components/schemas/SessionTokens"
        is_new_player:
          type: boolean
    BindResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/BindData"
        request_id:
          type: string
    RefreshData:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/SessionTokens"
    RefreshResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RefreshData"
        request_id:
          type: string
    LogoutResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out:
              type: boolean
        request_id:
          type: string
    AccountStatus:
      type: string
      enum: [ACTIVE, BANNED, DELETED]
    MeData:
      type: object
      required: [player_id, steam_id, persona_name, account_status, is_vip, last_login_at, created_at]
      properties:
        player_id:
          type: string
        steam_id:
          type: string
        persona_name:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MeResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/MeData"
        request_id:
          type: string
    HealthSuccess:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [live, ready]
        request_id:
          type: string
          pattern: "^req_[A-Za-z0-9_-]+$"
    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
