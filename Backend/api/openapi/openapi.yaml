        csr_pem: {type: string, minLength: 1}
    RelayCertificateRenewData:
      type: object
      required: [node, certificate_pem, ca_certificate_pem, certificate_expires_at, relay_token_keyset]
      properties:
        node:
          $ref: "#/components/schemas/RelayNode"
        certificate_pem: {type: string}
        ca_certificate_pem: {type: string}
        certificate_expires_at: {type: string, format: date-time}
        relay_token_keyset:
          $ref: "#/components/schemas/RelayTokenKeyset"
    RelayCertificateRenewResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RelayCertificateRenewData"
        request_id: {type: string}
    RelayNodeResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RelayNode"
        request_id: {type: string}
    RelayTokenClaims:
      type: object
      additionalProperties: false
      required: [iss, aud, kid, jti, relay_node_id, allocation_id, connection_id, room_id, endpoint_role, protocol, max_bps, max_pps, max_total_bytes, nbf, exp]
      properties:
        iss: {type: string, const: game-control-plane}
        aud: {type: string, const: game-relay}
        kid: {type: string}
        jti: {type: string, pattern: "^rt_[A-Za-z0-9]+$"}
        relay_node_id: {type: string}
        allocation_id: {type: string}
        connection_id: {type: string}
        room_id: {type: string}
        endpoint_role: {type: string, enum: [HOST, PEER]}
        protocol: {type: string, enum: [UDP, TCP_TLS]}
        max_bps: {type: integer, format: int64, minimum: 1}
        max_pps: {type: integer, minimum: 1}
        max_total_bytes: {type: integer, format: int64, minimum: 1}
        nbf: {type: integer, format: int64}
        exp: {type: integer, format: int64}
    ConnectionRelayAllocatedEvent:
