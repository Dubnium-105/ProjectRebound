openapi: 3.1.0
info:
  title: Project Rebound Game Control Plane API
  version: 0.1.0
  description: Public control-plane API. Internal Relay APIs are marked with x-internal.
servers:
  - url: https://api.example.com
paths:
  /v1/auth/bind:
    post:
      operationId: bindSteamIdentity
      tags: [Authentication]
      description: Accepts a client-asserted SteamID. This does not prove Steam account ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRequest"
      responses:
        "200":
          description: Player and a new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me:
    get:
      operationId: getCurrentPlayer
      tags: [Players]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current player state, read from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/players:
    get:
      operationId: adminListPlayers
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: account_status
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Paginated players.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/players/{player_id}:
    parameters:
      - $ref: "#/components/parameters/PlayerID"
    get:
      operationId: adminGetPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Player administrative record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminPatchPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlayerPatch"
      responses:
        "200":
          description: Updated player and session revocation count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerPatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/revoke-sessions:
    post:
      operationId: adminRevokePlayerSessions
      tags: [Admin]
      x-internal: true
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      responses:
        "200":
          description: All active sessions for the player were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/game-servers:
    post:
      operationId: registerGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerRegistrationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameServerRegistrationRequest"
      responses:
        "201":
          description: Server registered and management token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerRegistrationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listGameServers
      tags: [Dedicated Servers]
      parameters:
        - in: query
          name: region
          schema: {type: string}
        - in: query
          name: mode
          schema: {type: string}
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/GameServerState"
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Public server directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerListResponse"
  /v1/game-servers/{server_id}:
    parameters:
      - $ref: "#/components/parameters/GameServerID"
    get:
      operationId: getGameServer
      tags: [Dedicated Servers]
      responses:
        "200":
          description: Public server status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deregisterGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerToken: []
      responses:
        "200":
          description: Server deregistered and management token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerDeregistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/game-servers/{server_id}/heartbeat:
    post:
      operationId: heartbeatGameServer
      tags: [Dedicated Servers]
      security:
        - gameServerToken: []
      parameters:
        - $ref: "#/components/parameters/GameServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameServerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServerHeartbeatResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Invalid state transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms:
    get:
      operationId: listP2PRooms
      tags: [P2P Rooms]
      parameters:
        - in: query
          name: region
          schema: {type: string}
        - in: query
          name: mode
          schema: {type: string}
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/P2PRoomState"
        - in: query
          name: has_slots
          schema: {type: boolean}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Public P2P room directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomListResponse"
    post:
      operationId: createP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomCreateRequest"
      responses:
        "201":
          description: Room created and its one-time host management credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomCreateResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}:
    parameters:
      - $ref: "#/components/parameters/P2PRoomID"
    get:
      operationId: getP2PRoom
      tags: [P2P Rooms]
      responses:
        "200":
          description: Public room state. Network candidates and credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room closed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/p2p-rooms/{room_id}/join:
    post:
      operationId: joinP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2PRoomJoinRequest"
      responses:
        "200":
          description: Membership activated; repeated joins are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room full, not joinable, or client version mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/leave:
    post:
      operationId: leaveP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
      responses:
        "200":
          description: Membership deactivated; repeated leaves are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Host must close the room instead of leaving it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/heartbeat:
    post:
      operationId: heartbeatP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Host heartbeat accepted; a stale room returns to LOBBY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomHeartbeatResponse"
        "403":
          description: Account or independent host credential rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/p2p-rooms/{room_id}/start:
    post:
      operationId: startP2PRoom
      tags: [P2P Rooms]
      security:
        - playerAccessToken: []
      parameters:
        - $ref: "#/components/parameters/P2PRoomID"
        - $ref: "#/components/parameters/P2PRoomHostToken"
      responses:
        "200":
          description: Room transitioned from LOBBY to CONNECTING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PRoomResponse"
        "409":
          description: Room cannot start from its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/connections:
    post:
      operationId: createConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Idempotently creates a host-to-peer session. Joining a P2P room also creates this session automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreateRequest"
      responses:
        "201":
          description: Connection created or its active idempotent result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account or active room membership rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      operationId: getConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Returns candidates only to the connection's host or peer.
      responses:
        "200":
          description: Participant-scoped connection state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: Caller is not a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: closeConnection
      tags: [Connections]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Connection closed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "403":
          description: Active account and connection participation are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/realtime/connect:
    get:
      operationId: connectRealtime
      tags: [Connections]
      security:
        - playerAccessToken: []
      description: Upgrades to an authenticated WebSocket. Access tokens are accepted only in the Authorization header, never in the URL.
      x-websocket:
        inbound-message:
          oneOf:
            - $ref: "#/components/schemas/ConnectionCandidateEvent"
            - $ref: "#/components/schemas/ConnectionCheckResultEvent"
        outbound-message:
          oneOf:
            - $ref: "#/components/schemas/ConnectionRealtimeEvent"
            - $ref: "#/components/schemas/ConnectionRelayAllocatedEvent"
            - $ref: "#/components/schemas/RealtimeErrorEvent"
      responses:
        "101":
          description: WebSocket protocol switched.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/enroll:
    post:
      operationId: enrollRelayNode
      tags: [Internal Relay]
      x-internal: true
      description: Consumes a one-time bootstrap token and returns a node credential, mTLS certificate, CA, and relay-token verification keyset.
      security:
        - relayBootstrapToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayEnrollRequest"
      responses:
        "201":
          description: Relay node enrolled; node_token is returned once and persisted only as a hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayEnrollResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/{node_id}/certificate/renew:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: renewRelayNodeCertificate
      tags: [Internal Relay]
      x-internal: true
      security:
        - relayNodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayCertificateRenewRequest"
      responses:
        "200":
          description: A newly signed client certificate and current verification keyset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayCertificateRenewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/v1/relay-nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    get:
      operationId: getRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Relay node operational state. Node credentials are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/v1/relay-nodes/{node_id}/drain:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: drainRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Node stopped receiving new allocations; existing allocations remain until expiry or drain deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
        "409":
          description: Node is not READY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /internal/v1/relay-nodes/{node_id}/resume:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: resumeRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Node returned to READY and may receive new allocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
  /internal/v1/relay-nodes/{node_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/RelayNodeID"
    post:
      operationId: revokeRelayNode
      tags: [Internal Relay]
      x-internal: true
      security:
        - adminToken: []
      responses:
        "200":
          description: Node certificate identity and node credential permanently rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayNodeResponse"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    playerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: Static Admin Token
    gameServerRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: Preconfigured Registration Token
    gameServerToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque Game Server Token
    relayBootstrapToken:
      type: http
      scheme: bearer
      bearerFormat: One-Time Relay Bootstrap Token
    relayNodeToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque Relay Node Token
  parameters:
    PlayerID:
      in: path
      name: player_id
      required: true
      schema:
        type: string
    GameServerID:
      in: path
      name: server_id
      required: true
      schema:
        type: string
    P2PRoomID:
      in: path
      name: room_id
      required: true
      schema:
        type: string
    P2PRoomHostToken:
      in: header
      name: X-Room-Host-Token
      required: true
      description: Independent high-entropy room host credential. It is returned only at room creation.
      schema:
        type: string
        minLength: 64
    ConnectionID:
      in: path
      name: connection_id
      required: true
      schema:
        type: string
    RelayNodeID:
      in: path
      name: node_id
      required: true
      schema:
        type: string
        pattern: "^relay_[A-Za-z0-9]+$"
  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, reused, or revoked session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-IP request limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminUnauthorized:
      description: A dedicated administrator token is required; Player tokens are not accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not exposed on this network.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BindRequest:
      type: object
      additionalProperties: false
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
          pattern: "^[0-9]{16,20}$"
        persona_name:
          type: string
          maxLength: 64
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 64
    SessionTokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
    PlayerProfile:
      type: object
      required: [steam_id, persona_name]
      properties:
        steam_id:
          type: string
        persona_name:
          type: string
    BindData:
      type: object
      required: [player_id, account_status, is_vip, profile, session, is_new_player]
      properties:
        player_id:
          type: string
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        is_vip:
          type: boolean
        profile:
          $ref: "#/components/schemas/PlayerProfile"
        session:
          $ref: "#/components/schemas/SessionTokens"
        is_new_player:
          type: boolean
    BindResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/BindData"
        request_id:
          type: string
    RefreshData:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/SessionTokens"
    RefreshResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RefreshData"
        request_id:
          type: string
    LogoutResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out:
              type: boolean
        request_id:
          type: string
    AccountStatus:
      type: string
      enum: [ACTIVE, BANNED, DELETED]
    MeData:
      type: object
