      required: [display_name, region, zone, provider, software_version, protocol_version, advertised_endpoints, supported_protocols, capacity, csr_pem]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 64}
        region: {type: string, minLength: 1, maxLength: 64}
        zone: {type: string, minLength: 1, maxLength: 64}
        provider: {type: string, minLength: 1, maxLength: 64}
        software_version: {type: string, minLength: 1, maxLength: 64}
        protocol_version: {type: integer, minimum: 1}
        advertised_endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RelayEndpoint"
        supported_protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [UDP, TCP_TLS]}
        capacity:
          $ref: "#/components/schemas/RelayCapacity"
        csr_pem: {type: string, minLength: 1}
    RelayPublicKey:
      type: object
      required: [kid, alg, public_key]
      properties:
        kid: {type: string}
        alg: {type: string, const: EdDSA}
        public_key: {type: string, description: Base64url-encoded Ed25519 public key.}
    RelayTokenKeyset:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RelayPublicKey"
    RelayNode:
      type: object
      description: Internal operational view. node_token and node_token_hash are intentionally absent.
      required: [node_id, display_name, region, zone, provider, state, software_version, protocol_version, public_endpoints, supported_protocols, max_allocations, max_egress_bps, active_allocations, current_egress_bps, current_ingress_bps, certificate_fingerprint, certificate_expires_at, config_version]
      properties:
        node_id: {type: string}
        display_name: {type: string}
        region: {type: string}
        zone: {type: string}
        provider: {type: string}
        state:
          $ref: "#/components/schemas/RelayNodeState"
        software_version: {type: string}
        protocol_version: {type: integer, minimum: 1}
        public_endpoints:
          type: array
          items:
            $ref: "#/components/schemas/RelayEndpoint"
        supported_protocols:
          type: array
          items: {type: string, enum: [UDP, TCP_TLS]}
        max_allocations: {type: integer, minimum: 1}
        max_egress_bps: {type: integer, format: int64, minimum: 1}
        active_allocations: {type: integer, minimum: 0}
        current_egress_bps: {type: integer, format: int64, minimum: 0}
        current_ingress_bps: {type: integer, format: int64, minimum: 0}
        certificate_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
        certificate_expires_at: {type: string, format: date-time}
        config_version: {type: integer, format: int64, minimum: 1}
        last_heartbeat_at: {type: string, format: date-time}
        lease_expires_at: {type: string, format: date-time}
        drain_deadline: {type: string, format: date-time}
    RelayEnrollData:
      type: object
      required: [node, node_token, certificate_pem, ca_certificate_pem, certificate_expires_at, relay_token_keyset]
      properties:
        node:
          $ref: "#/components/schemas/RelayNode"
        node_token:
          type: string
          minLength: 64
          description: Returned once. The control plane stores only its SHA-256 hash.
        certificate_pem: {type: string}
        ca_certificate_pem: {type: string}
        certificate_expires_at: {type: string, format: date-time}
        relay_token_keyset:
          $ref: "#/components/schemas/RelayTokenKeyset"
    RelayEnrollResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/RelayEnrollData"
        request_id: {type: string}
    RelayCertificateRenewRequest:
