openapi: 3.1.0
info:
  title: Project Rebound Game Control Plane API
  version: 1.3.0
  description: Public control-plane API. Internal Relay APIs are marked with x-internal.
servers:
  - url: https://api.example.com
paths:
  /v1/auth/bind:
    post:
      operationId: bindSteamIdentity
      tags: [Authentication]
      description: >-
        Binds a Steam identity and creates the existing JWT/refresh-token
        session. encrypted_ticket is optional for legacy compatibility. When
        present it is decrypted by the configured external verifier, and the
        identity from the ticket is authoritative. Invalid, expired, replayed,
        wrong-AppID, or SteamID-mismatched tickets are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRequest"
      responses:
        "200":
          description: Player and a new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The matching device fingerprint is restricted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/integrity/challenge:
    post:
      operationId: createIntegrityChallenge
      tags: [Authentication]
      description: Replaces any outstanding one-time nonce for the authenticated Steam-ticket session. Returns an empty nonce when no in-memory ticket is available.
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Ephemeral one-time integrity challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityChallengeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/integrity/proof:
    post:
      operationId: submitIntegrityProof
      tags: [Authentication]
      description: Verifies SHA-256 over the configured ToolBox PEM bytes, the current session's raw encrypted Steam ticket, and the one-time nonce. A successful proof promotes the session to trusted. Three consecutive failures revoke it.
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrityProofRequest"
      responses:
        "200":
          description: Proof result. Invalid proofs intentionally use the same response shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityProofResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/integrity/verify:
    post:
      operationId: verifyIntegrityChallenge
      tags: [Authentication]
      deprecated: true
      description: Compatibility alias for POST /v1/integrity/proof.
      security:
        - playerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrityProofRequest"
      responses:
        "200":
          description: Proof result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityProofResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me:
    get:
      operationId: getCurrentPlayer
      tags: [Players]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Current player state, read from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me/sessions:
    get:
      operationId: listMySessions
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Active sessions owned by the authenticated player. Token hashes and raw device identifiers are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/users/me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      tags: [Authentication]
      security:
        - playerAccessToken: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, pattern: "^ses_[A-Za-z0-9]+$"}
      responses:
        "200":
          description: The owned session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/users/me/sessions/revoke-others:
    post:
      operationId: revokeMyOtherSessions
      tags: [Authentication]
      security:
        - playerAccessToken: []
      responses:
        "200":
          description: Every active session except the calling session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOtherSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/auth/config:
    get:
      operationId: getAdminAuthenticationConfig
      tags: [Admin Authentication]
      x-internal: true
      description: Returns public login-page configuration only. Turnstile Secret is never returned.
      responses:
        "200":
          description: Administrator login configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthConfigResponse"
  /v1/admin/auth/login:
    post:
      operationId: beginAdminLogin
      tags: [Admin Authentication]
      x-internal: true
      description: Validates the Turnstile token and administrator password before issuing a short-lived MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "202":
          description: Password accepted; TOTP or a recovery code is still required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Turnstile validation is temporarily unavailable or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/auth/mfa/verify:
    post:
      operationId: verifyAdminMFA
      tags: [Admin Authentication]
      x-internal: true
      description: Consumes the single-use MFA challenge and creates an administrator session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMFAVerifyRequest"
      responses:
        "200":
          description: MFA accepted. A rotated refresh token is set in an HttpOnly, SameSite=Strict cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      tags: [Admin Authentication]
      x-internal: true
      description: Rotates the HttpOnly refresh cookie and returns a new short-lived access token.
      responses:
        "200":
          description: Administrator session rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/step-up:
    post:
      operationId: verifyAdminStepUpMFA
      tags: [Admin Authentication]
      x-internal: true
      security:
        - adminAccessToken: []
      description: Re-verifies TOTP or a recovery code and returns a five-minute, session-bound proof for high-risk actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStepUpRequest"
      responses:
        "200":
          description: MFA accepted; the proof is returned once and must remain in browser memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStepUpResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [Admin Authentication]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Current administrator session revoked and refresh cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/me:
    get:
      operationId: getCurrentAdmin
      tags: [Admin Authentication]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Current administrator identity, roles, and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAdminResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/sessions:
    get:
      operationId: listAdminSessions
      tags: [Admin Authentication]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Active sessions owned by the current administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/auth/sessions/{session_id}:
    delete:
      operationId: revokeAdminSession
      tags: [Admin Authentication]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, pattern: "^adm_ses_[A-Za-z0-9]+$"}
      responses:
        "200":
          description: Owned administrator session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players:
    get:
      operationId: adminListPlayers
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: account_status
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Paginated players.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/players/{player_id}:
    parameters:
      - $ref: "#/components/parameters/PlayerID"
    get:
      operationId: adminGetPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Player administrative record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminPatchPlayer
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlayerPatch"
      responses:
        "200":
          description: Updated player and session revocation count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerPatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/revoke-sessions:
    post:
      operationId: adminRevokePlayerSessions
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOperationReason"
      responses:
        "200":
          description: All active sessions for the player were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionRevocationResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/sessions:
    get:
      operationId: adminListPlayerSessions
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      responses:
        "200":
          description: Recent player sessions with device and IP summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerSessionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/risk-events:
    get:
      operationId: adminListPlayerRiskEvents
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      responses:
        "200":
          description: Recent masked and redacted risk events for a player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRiskEventListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/players/{player_id}/login-events:
    get:
      operationId: adminListPlayerLoginEvents
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - $ref: "#/components/parameters/PlayerID"
      responses:
        "200":
          description: Recent player authentication outcomes with IP summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayerLoginEventListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/invite-codes:
    post:
      operationId: adminCreateInviteCode
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCodeCreateRequest"
      responses:
        "201":
          description: Invite metadata and the plaintext code. The code is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeCreateResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
    get:
      operationId: adminListInviteCodes
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Paginated invite metadata. Plaintext codes and hashes are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/invite-codes/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, pattern: "^inv_[A-Za-z0-9]+$"}
    get:
      operationId: adminGetInviteCode
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Invite metadata without plaintext or hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminPatchInviteCode
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCodePatchRequest"
      responses:
        "200":
          description: Updated invite metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/invite-codes/{id}/revoke:
    post:
      operationId: adminRevokeInviteCode
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: "^inv_[A-Za-z0-9]+$"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOperationReason"
      responses:
        "200":
          description: Idempotently revoked invite metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/invite-codes/{id}/uses:
    get:
      operationId: adminListInviteCodeUses
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: "^inv_[A-Za-z0-9]+$"}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Paginated successful uses. Network addresses are masked summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeUseListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/dashboard/summary:
    get:
      operationId: adminDashboardSummary
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Current operational counters for the administrator dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardSummaryResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/dashboard/timeseries:
    get:
      operationId: adminDashboardTimeseries
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: query
          name: period
          schema: {type: string, enum: [1h, 24h, 7d, 30d], default: 24h}
      responses:
        "200":
          description: Whitelisted login, room, and risk-event time buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardTimeseriesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/dashboard/alerts:
    get:
      operationId: adminDashboardAlerts
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Actionable current operational alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardAlertListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/risk-events:
    get:
      operationId: adminListAuthenticationRiskEvents
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: player_id
          schema: {type: string}
        - in: query
          name: steam_id
          schema: {type: string}
        - in: query
          name: event_type
          schema: {$ref: "#/components/schemas/AuthRiskEventType"}
        - in: query
          name: severity
          schema: {$ref: "#/components/schemas/AuthRiskSeverity"}
        - in: query
          name: unresolved_only
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Authentication risk observations. Device hashes are not exposed and IP addresses are masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRiskEventListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /v1/admin/risk-events/{event_id}:
    parameters:
      - in: path
        name: event_id
        required: true
        schema: {type: string}
    get:
      operationId: adminGetAuthenticationRiskEvent
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      responses:
        "200":
          description: Risk event details with sensitive fields redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRiskEventResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/risk-events/{event_id}/resolve:
    post:
      operationId: adminResolveAuthenticationRiskEvent
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOperationReason"
      responses:
        "200":
          description: Resolved risk event and administrator resolution metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRiskEventResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: admin_id
          schema: {type: string}
        - in: query
          name: action
          schema: {type: string}
        - in: query
          name: target_type
          schema: {type: string}
        - in: query
          name: target_id
          schema: {type: string}
      responses:
        "200":
          description: Paginated administrator write audit records with sensitive values redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogListResponse"
  /v1/admin/audit-logs/{audit_id}:
    get:
      operationId: adminGetAuditLog
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
        - in: path
          name: audit_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: One administrator audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/login-audit:
    get:
      operationId: adminListLoginAudit
      tags: [Admin]
      x-internal: true
      security:
        - adminAccessToken: []
      parameters:
