name: Deploy

on:
  workflow_run:
    workflows: ["CI and Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: all
        options: [all, control-plane, meta-server, edge-relay]
      environment:
        description: GitHub Environment tier
        type: choice
        required: true
        default: staging
        options: [staging, production]
      commit_sha:
        description: Full 40-character SHA already published to GHCR; blank uses the selected ref
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy-control-plane:
    name: Deploy control plane
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.ENABLE_STAGING_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'all' || inputs.target == 'control-plane'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_run' && 'staging-control-plane' || format('{0}-control-plane', inputs.environment) }}
      url: ${{ vars.PUBLIC_BASE_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}-control-plane
      cancel-in-progress: false
    steps:
      - name: Resolve deployment SHA
        id: revision
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required" >&2; exit 1; }
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/projectrebound-control-plane:sha-${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Deploy, verify and roll back on failure
        shell: bash
        env:
          DEPLOY_TARGET: control-plane
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_RELEASE_ID: ${{ format('sha-{0}-{1}-{2}-control', steps.revision.outputs.sha, github.run_id, github.run_attempt) }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
          CONTROL_PLANE_ENV_FILE: ${{ vars.CONTROL_PLANE_ENV_FILE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ENABLE_MONITORING: ${{ vars.ENABLE_MONITORING || '1' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: Backend/scripts/deploy-over-ssh.sh

  deploy-meta-server:
    name: Deploy MetaServer only
    needs: [deploy-control-plane]
    if: >-
      always() &&
      (needs.deploy-control-plane.result == 'success' ||
       needs.deploy-control-plane.result == 'skipped') &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.ENABLE_STAGING_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'all' || inputs.target == 'meta-server')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_run' && 'staging-meta-server' || format('{0}-meta-server', inputs.environment) }}
      url: ${{ vars.META_PUBLIC_BASE_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}-meta-server
      cancel-in-progress: false
    steps:
      - name: Resolve deployment SHA
        id: revision
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required" >&2; exit 1; }
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve MetaServer image reference
        id: image
        shell: bash
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/projectrebound-meta-server:sha-${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Deploy MetaServer, verify and roll back only MetaServer on failure
        shell: bash
        env:
          DEPLOY_TARGET: meta-server
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_RELEASE_ID: ${{ format('sha-{0}-{1}-{2}-meta', steps.revision.outputs.sha, github.run_id, github.run_attempt) }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
          CONTROL_PLANE_ENV_FILE: ${{ vars.CONTROL_PLANE_ENV_FILE }}
          PUBLIC_BASE_URL: ${{ vars.META_PUBLIC_BASE_URL }}
          ENABLE_MONITORING: "0"
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: Backend/scripts/deploy-over-ssh.sh

  deploy-edge-relay:
    name: Deploy edge relay
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.ENABLE_STAGING_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'all' || inputs.target == 'edge-relay'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_run' && 'staging-edge-relay' || format('{0}-edge-relay', inputs.environment) }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}-edge-relay
      cancel-in-progress: false
    steps:
      - name: Resolve deployment SHA
        id: revision
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required" >&2; exit 1; }
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/projectrebound-edge-relay:sha-${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Deploy, verify and roll back on failure
        shell: bash
        env:
          DEPLOY_TARGET: edge-relay
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_RELEASE_ID: ${{ format('sha-{0}-{1}-{2}-edge', steps.revision.outputs.sha, github.run_id, github.run_attempt) }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
          EDGE_RELAY_ENV_FILE: ${{ vars.EDGE_RELAY_ENV_FILE }}
          EDGE_RELAY_CONFIG_FILE: ${{ vars.EDGE_RELAY_CONFIG_FILE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: Backend/scripts/deploy-over-ssh.sh
