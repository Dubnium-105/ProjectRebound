name: CI and Images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend, PostgreSQL and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: projectrebound_test
          POSTGRES_USER: projectrebound
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectrebound -d projectrebound_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://projectrebound:ci-postgres-only@127.0.0.1:5432/projectrebound_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Backend/go.mod
          cache-dependency-path: Backend/go.sum

      - name: Check formatting
        shell: bash
        run: |
          gofmt -l . | tee /tmp/projectrebound-gofmt.txt
          test ! -s /tmp/projectrebound-gofmt.txt

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Build control plane and edge relay
        run: |
          go build -trimpath ./cmd/control-plane
          go build -trimpath ./cmd/edge-relay

  contracts:
    name: .NET contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build shared contracts
        run: dotnet build Shared/ProjectRebound.Contracts/ProjectRebound.Contracts.csproj --configuration Release

  deployment-config:
    name: Deployment and workflow configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate shell syntax and line endings
        shell: bash
        run: |
          bash -n Backend/scripts/*.sh Backend/deploy/deploy.sh Backend/tests/netem/run-relay-matrix.sh
          if grep -IUlr $'\r' Backend/scripts Backend/deploy Backend/tests/netem; then
            echo "CRLF found in Linux shell scripts" >&2
            exit 1
          fi

      - name: Test release activation and automatic rollback
        run: Backend/scripts/test-remote-deploy.sh

      - name: Generate production-shaped secrets
        run: |
          Backend/scripts/generate-control-plane-env.sh /tmp/projectrebound-control-plane.env
          test "$(stat -c '%a' /tmp/projectrebound-control-plane.env)" = "600"

      - name: Validate separated Compose files
        run: |
          cp Backend/deployments/edge-relay/config.edge-relay.yaml.example \
             Backend/deployments/edge-relay/config.edge-relay.yaml
          docker compose --env-file /tmp/projectrebound-control-plane.env \
            -f Backend/deployments/control-plane/docker-compose.yaml \
            --profile monitoring config -q
          docker compose --env-file Backend/deployments/edge-relay/.env.example \
            -f Backend/deployments/edge-relay/docker-compose.yaml config -q

      - name: Validate public Caddy policy
        run: |
          docker run --rm \
            -e PUBLIC_API_SITE=http://:80 \
            -v "$GITHUB_WORKSPACE/Backend/deployments/control-plane/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  container-build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dockerfile: Backend/deployments/compose/control-plane.Dockerfile
          - name: edge-relay
            dockerfile: Backend/deployments/relay/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: Backend
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-images:
    name: Publish ${{ matrix.name }} image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, contracts, deployment-config, container-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dockerfile: Backend/deployments/compose/control-plane.Dockerfile
          - name: edge-relay
            dockerfile: Backend/deployments/relay/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/projectrebound-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: Backend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
