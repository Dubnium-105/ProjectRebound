name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  dotnet-build:
    name: .NET Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Contracts
        run: dotnet build Shared/ProjectRebound.Contracts/ProjectRebound.Contracts.csproj --configuration Release

      # ProjectRebound.Browser is a Windows-only WPF/WinForms app
      # and cannot be built on Linux. Skipped in CI.
